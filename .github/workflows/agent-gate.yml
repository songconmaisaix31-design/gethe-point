name: Agent ownership gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  ownership-and-control-plane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout worker head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate child-Agent Worktree plan
        run: python -B scripts/fleet.py validate .agents/plans/current.json

      - name: Test Worktree isolation and completion gates
        run: python -B -m unittest discover -s scripts/tests -v

      - name: Enforce directory ownership and task commit IDs
        run: >-
          python -B scripts/gate.py check
          --branch "${{ github.head_ref }}"
          --base "origin/${{ github.base_ref }}"
          --head HEAD
          --committed-only
          --check-commits
